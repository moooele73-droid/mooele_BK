<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日筆記整理</title>
<meta name="theme-color" content="#1f6f68">
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --ink:#1d2321; --muted:#6b7370; --line:#e3ded3;
  --accent:#1f6f68; --accent-soft:#e2efec; --warn:#b5482f; --mark:#fff0b3;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141716;--card:#1d2120;--ink:#e8ebe9;--muted:#9aa3a0;--line:#2e3432;
  --accent:#5fb8ad;--accent-soft:#213431;--warn:#e07a62;--mark:#5a4a12;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;letter-spacing:.02em}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav button.on{background:var(--accent);color:#fff}
.search{flex:1 1 180px;max-width:260px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:520px){nav{width:100%;justify-content:space-between}nav button{padding:6px 8px;font-size:14px}.search{max-width:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{position:static!important;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .side .item{flex:0 0 auto}.side h4{display:none}}
.side{position:sticky;top:70px}
.side h4{margin:4px 6px 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.item .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:17px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:8px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;cursor:pointer}
.kw{display:inline-block;padding:0 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);margin:2px 4px 0 0}
.summary{color:var(--muted);margin:4px 0 8px}
.card ul{margin:6px 0;padding-left:20px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.thumbs img{height:64px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;object-fit:cover}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:wait}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;border:0;border-radius:999px;
  background:var(--accent);color:#fff;padding:14px 22px;font-size:16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.md h1,.md h2,.md h3{margin:14px 0 6px;line-height:1.35}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15.5px}
.md p{margin:6px 0}.md ul,.md ol{margin:4px 0;padding-left:22px}
.md code{background:var(--accent-soft);padding:0 4px;border-radius:4px;font-size:.92em}
.md blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.ref{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;font-size:13.5px}
.ref .src{font-size:12px;color:var(--accent);font-weight:600}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.related{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.notice{font-size:12.5px;color:var(--muted)}
.stale{color:var(--warn);font-size:12.5px}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(640px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 20px;overflow:auto;max-height:90vh}
.dlg h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.previews div{position:relative}
.previews img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.previews button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding-top:8px}
.progress{font-size:13px;color:var(--accent);margin-top:10px;min-height:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
#viewer{width:auto;max-width:96vw;background:#000}
#viewer img{display:block;max-width:96vw;max-height:88vh}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.section-title h2{margin:0;font-size:20px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre.raw{white-space:pre-wrap;font-size:12.5px;background:var(--bg);padding:8px;border-radius:8px;max-height:240px;overflow:auto}
.mapping td{padding:3px 8px;border-bottom:1px solid var(--line)}
</style>
</head>

<script type="module">
/* ============================================================
   儲存層：IndexedDB（全部資料只存在你的瀏覽器）
   ============================================================ */
const DB_NAME = 'daily-notes', DB_VER = 1;
let _db;
function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const db = r.result;
      for (const s of ['notes','images','refs','kv']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath:'id'});
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn){
  const db = await openDB();
  return new Promise((res, rej)=>{
    const t = db.transaction(store, mode), s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const db = {
  all: s => tx(s,'readonly', st => st.getAll()),
  get: (s,id) => tx(s,'readonly', st => st.get(id)),
  put: (s,v) => tx(s,'readwrite', st => st.put(v)),
  del: (s,id) => tx(s,'readwrite', st => st.delete(id)),
  clear: s => tx(s,'readwrite', st => st.clear()),
};
const kvGet = async k => (await db.get('kv', k))?.value;
const kvSet = (k, value) => db.put('kv', {id:k, value});

/* ============================================================
   設定
   ============================================================ */
const DEFAULTS = { provider:'gemini', geminiKey:'', geminiModel:'gemini-flash-latest', geminiFallback:'gemini-flash-lite-latest',
  claudeKey:'', claudeModel:'claude-sonnet-5-5', lang:'繁體中文' };
let settings = {...DEFAULTS, ...JSON.parse(localStorage.getItem('dn-settings')||'{}')};
const saveSettings = () => localStorage.setItem('dn-settings', JSON.stringify(settings));

/* ============================================================
   工具
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = d => { const [y,m,dd] = d.split('-'); const w = '日一二三四五六'[new Date(d+'T00:00').getDay()]; return `${y}/${m}/${dd}（${w}）`; };
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms); }

/* 精簡 Markdown 轉 HTML（先跳脫，避免 XSS） */
function md(src){
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const lines = String(src||'').replace(/\r/g,'').split('\n');
  let html='', list=null;
  const close = () => { if (list){ html += `</${list}>`; list=null; } };
  for (const raw of lines){
    const l = raw.trimEnd();
    let m;
    if (!l.trim()){ close(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))){ close(); const n=Math.min(m[1].length+1,3); html+=`<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if ((m = l.match(/^(\s*)[-*•]\s+(.*)/))){ if(list!=='ul'){close();html+='<ul>';list='ul';} const pad=Math.min(m[1].length,8)*6; html+=`<li style="margin-left:${pad}px">${inline(m[2])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close();html+='<ol>';list='ol';} html+=`<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^>\s?(.*)/))){ close(); html+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    close(); html += `<p>${inline(l)}</p>`;
  }
  close(); return html;
}

/* 圖片壓縮：長邊 1600px JPEG，減少傳輸量 */
async function compressImage(file, maxSide=1600, q=0.8){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

/* ============================================================
   AI 呼叫（瀏覽器直接呼叫，金鑰只存在你的裝置）
   ============================================================ */
function extractJSON(text){
  let t = String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a>=0 && b>a) return JSON.parse(t.slice(a,b+1));
  throw new Error('AI 回傳的格式無法解析');
}
const GEMINI_FALLBACKS = ['gemini-flash-lite-latest', 'gemini-2.5-flash'];
async function callAI({prompt, images=[], json=false, onStatus}){
  if (window.__mockAI) return window.__mockAI({prompt, images, json, onStatus}); // 測試用
  const p = settings.provider;
  const key = p==='gemini' ? settings.geminiKey : settings.claudeKey;
  if (!key) { openSettingsHint(); throw new Error('請先到「設定」填入 API 金鑰'); }
  const b64 = images.map(d => d.split(',')[1]);
  let res, data, text;
  if (p === 'gemini'){
    const body = JSON.stringify({
      contents:[{role:'user', parts:[...b64.map(d=>({inline_data:{mime_type:'image/jpeg', data:d}})), {text:prompt}]}],
      generationConfig: json ? {responseMimeType:'application/json', temperature:0.2} : {temperature:0.3}
    });
    // 主要模型 → 失敗時改用備用模型；伺服器忙碌（429/500/503）會自動等一下再重試
    const models = [...new Set([settings.geminiModel || DEFAULTS.geminiModel, settings.geminiFallback, ...GEMINI_FALLBACKS].filter(Boolean))];
    const waits = [3, 8];
    let lastErr;
    outer: for (const model of models){
      for (let attempt=0; attempt<=waits.length; attempt++){
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key}, body });
        data = await res.json().catch(()=>({}));
        if (res.ok){ if (model !== models[0]) onStatus?.(`（已改用備用模型 ${model}）`); break outer; }
        lastErr = data.error?.message || res.status;
        const busy = [429,500,502,503,504].includes(res.status) || /overload|high demand|unavailable|try again/i.test(lastErr);
        const missing = res.status===404 || /not found|not supported/i.test(lastErr);
        if (missing) continue outer;            // 模型不存在 → 直接換下一個
        if (!busy) throw new Error('Gemini 錯誤：' + lastErr);
        if (attempt < waits.length){
          onStatus?.(`⏳ Gemini 目前忙碌，${waits[attempt]} 秒後自動重試（${model}）…`);
          await new Promise(r=>setTimeout(r, waits[attempt]*1000));
        }
      }
      onStatus?.(`⏳ ${model} 忙碌中，改用備用模型…`);
    }
    if (!res.ok) throw new Error('Gemini 伺服器目前太忙，所有模型都暫時無法使用，請過幾分鐘再按一次（照片會保留）。原始訊息：' + lastErr);
    text = (data.candidates?.[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('');
  } else {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model: settings.claudeModel || DEFAULTS.claudeModel, max_tokens: 8000,
        messages:[{role:'user', content:[...b64.map(d=>({type:'image', source:{type:'base64', media_type:'image/jpeg', data:d}})),
          {type:'text', text: prompt + (json ? '\n\n只輸出 JSON，不要任何其他文字。' : '')}]}] })
    });
    data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error('Claude 錯誤：' + (data.error?.message || res.status));
    text = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  }
  if (!text) throw new Error('AI 沒有回傳內容');
  return json ? extractJSON(text) : text;
}
async function listModels(){
  const p = settings.provider;
  if (p==='gemini'){
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {headers:{'x-goog-api-key':settings.geminiKey}});
    const d = await r.json(); if (!r.ok) throw new Error(d.error?.message||r.status);
    return (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
  }
  const r = await fetch('https://api.anthropic.com/v1/models?limit=100', {headers:{'x-api-key':settings.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
  const d = await r.json(); if (!r.ok) throw new Error(d.error?.message||r.status);
  return (d.data||[]).map(m=>m.id);
}

/* ============================================================
   狀態
   ============================================================ */
let notes = [], refs = [];
const state = { view:'date', date:null, cat:null, q:'' };
async function load(){ notes = await db.all('notes'); refs = await db.all('refs'); }
const categories = () => {
  const m = new Map(); for (const n of notes) m.set(n.category||'未分類', (m.get(n.category||'未分類')||0)+1);
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
};
const matchQ = n => !state.q || [n.title,n.summary,n.category,n.mine,(n.points||[]).join(' '),(n.keywords||[]).join(' '),n.rawText].join(' ').toLowerCase().includes(state.q.toLowerCase());

/* ============================================================
   1) 拍照 → AI 辨識 → 整理成筆記
   ============================================================ */
let pending = []; // dataURL[]
function renderPreviews(){
  $('#previews').innerHTML = pending.map((d,i)=>`<div><img src="${d}" alt=""><button data-i="${i}" title="移除">×</button></div>`).join('');
}
async function addFiles(files){

/* ============================================================
   教科書引用：上傳 PDF / 文字檔 → 本機全文檢索（BM25）
   ============================================================ */
function tokenize(s){
  s = String(s||'').toLowerCase();
  const out = [];
  for (const w of s.match(/[a-z0-9][a-z0-9\-]+/g)||[]) out.push(w);
  for (const run of s.match(/[㐀-鿿豈-﫿]+/g)||[]){
    if (run.length===1) out.push(run);
    for (let i=0;i<run.length-1;i++) out.push(run.slice(i,i+2)); // 中文以雙字詞切分
  }
  return out;
}
function chunkText(text, page){
  const clean = text.replace(/\s+\n/g,'\n').replace(/[ \t]+/g,' ').trim(); const out=[];
  for (let i=0;i<clean.length;i+=550){ const t = clean.slice(Math.max(0,i-50), i+550); if (t.trim().length>20) out.push({page, text:t}); }
  return out;
}
async function importRef(file, onProg){
  let chunks = [];
  if (file.name.toLowerCase().endsWith('.pdf')){
    const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    const pdf = await pdfjs.getDocument({data: await file.arrayBuffer()}).promise;
    for (let p=1;p<=pdf.numPages;p++){
      const tc = await (await pdf.getPage(p)).getTextContent();
      chunks.push(...chunkText(tc.items.map(i=>i.str+(i.hasEOL?'\n':'')).join(''), p));
      if (p%10===0) onProg?.(`讀取中 ${p}/${pdf.numPages} 頁`);
    }
    if (!chunks.length) throw new Error('這份 PDF 讀不到文字（可能是掃描檔）。可先用 Google 雲端硬碟或 Adobe 做 OCR 再上傳。');
  } else {
    const text = await file.text();
    text.split(/\n(?=#{1,3}\s)|\f/).forEach((sec,i)=>chunks.push(...chunkText(sec, i+1)));
  }
  const ref = {id:uid(), name:file.name.replace(/\.(pdf|txt|md)$/i,''), addedAt:Date.now(), unit:file.name.toLowerCase().endsWith('.pdf')?'頁':'段', chunks};
  await db.put('refs', ref); return ref;
}
function searchRefs(query, k=4){
  const qt = [...new Set(tokenize(query))]; if (!qt.length || !refs.length) return [];
  const docs = []; for (const r of refs) for (const c of r.chunks) docs.push({r, c});
  for (const d of docs){
    if (!d.c._tf){ const tf = new Map(), tk = tokenize(d.c.text); for (const x of tk) tf.set(x,(tf.get(x)||0)+1);
      Object.defineProperty(d.c,'_tf',{value:tf}); Object.defineProperty(d.c,'_len',{value:tk.length}); }
    d.tf = d.c._tf; d.len = d.c._len;
  }
  const N = docs.length, avg = docs.reduce((s,d)=>s+d.len,0)/N, df = {};
  for (const t of qt) df[t] = docs.reduce((s,d)=>s+(d.tf.has(t)?1:0),0);
  const scored = docs.map(d=>{
    let s=0; const len=d.len;
    for (const t of qt){ if(!df[t]) continue; const f=d.tf.get(t)||0; if(!f) continue;
      const idf=Math.log(1+(N-df[t]+.5)/(df[t]+.5)); s+= idf*(f*2.2)/(f+1.2*(1-.75+.75*len/avg)); }
    return {...d, score:s};
  }).filter(d=>d.score>0).sort((a,b)=>b.score-a.score);
  // 同一頁只取一次
  const seen=new Set(), out=[];
  const minScore = (scored[0]?.score||0) * 0.35; // 太弱的關聯不顯示
  for (const d of scored){ if (d.score < minScore) break; const key=d.r.id+':'+d.c.page; if(seen.has(key)) continue; seen.add(key); out.push(d); if(out.length>=k) break; }
  return out;
}
function highlight(text, words){
  let h = esc(text);
  for (const w of words.filter(w=>w && w.length>=2).sort((a,b)=>b.length-a.length).slice(0,8))
    h = h.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
  return h;
}

      <button class="btn" data-act="copy-all-md">📋 複製到剪貼簿</button>
      <a class="btn" href="https://notebooklm.google.com/" target="_blank" rel="noopener" style="text-decoration:none">開啟 Gemini Notebook ↗</a>
    </div>
  </div>`;
}

/* ============================================================
   匯出
   ============================================================ */
function noteMD(n){
  return `### ${n.title}\n*${n.date}｜${n.category}*\n\n${n.summary?n.summary+'\n\n':''}${(n.points||[]).map(p=>'- '+p).join('\n')}\n${n.mine?`\n> 我的補充：${n.mine}\n`:''}${(n.keywords||[]).length?`\n關鍵字：${n.keywords.join('、')}\n`:''}`;
}
async function buildMD(filter, title){
  const list = notes.filter(filter).sort((a,b)=>a.date.localeCompare(b.date));
  const byCat = {}; for (const n of list) (byCat[n.category] ||= []).push(n);
  let out = `# ${title}\n\n匯出時間：${new Date().toLocaleString()}\n\n`;
  for (const [c, arr] of Object.entries(byCat)){
    out += `## ${c}\n\n`;
    const m = await kvGet('merge:'+c);
    if (m) out += `#### 主題總整理\n\n${m.md.replace(/^(#{1,3})\s/gm,'$1### ')}\n\n#### 各日筆記\n\n`;
    out += arr.map(noteMD).join('\n') + '\n';
  }
  return out;
}
function download(name, text, type='text/markdown'){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function openSettingsHint(){ state.view='settings'; render(); }

/* ============================================================
   主渲染 & 事件
   ============================================================ */
function emptyState(){
  return `<div class="empty"><b>還沒有筆記</b>按右下角「＋ 新增筆記」，拍一張 PPT 試試看。<br>
  ${settings.geminiKey||settings.claudeKey ? '' : '<br>第一次使用請先到 <a href="#" data-goto="settings">⚙️ 設定</a> 填入 AI 金鑰。'}</div>`;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.view));
  const app = $('#app');
  app.innerHTML = {date:viewDate, topic:viewTopic, refs:viewRefs, settings:viewSettings}[state.view]();
  hydrateThumbs(app);
  if (state.view==='topic' && notes.length) renderMergeBox();
  $('#fab').hidden = state.view==='settings';
}
function showInfo(html){ $('#infoBody').innerHTML = html; dlgInfo.showModal(); }

let editing = null;
function openEdit(n){
  editing = n;
  $('#eTitle').value=n.title; $('#eCat').value=n.category; $('#eDate').value=n.date; $('#eSummary').value=n.summary||'';
  $('#ePoints').value=(n.points||[]).join('\n'); $('#eKw').value=(n.keywords||[]).join(', '); $('#eMine').value=n.mine||'';
  $('#catList').innerHTML = categories().map(([c])=>`<option value="${esc(c)}">`).join('');
  dlgEdit.showModal();
}
$('#btnSaveEdit').onclick = async ()=>{
  const n = editing; if (!n) return;
  Object.assign(n, { title:$('#eTitle').value.trim()||'未命名筆記', category:$('#eCat').value.trim()||'未分類', date:$('#eDate').value||n.date,
    summary:$('#eSummary').value.trim(), points:$('#ePoints').value.split('\n').map(s=>s.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean),
    keywords:$('#eKw').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean), mine:$('#eMine').value.trim(), updatedAt:Date.now() });
  await db.put('notes', n); dlgEdit.close(); await load(); render(); toast('已儲存');
};

document.addEventListener('click', async e=>{
  const t = e.target;
  const tab = t.closest('#tabs button'); if (tab){ state.view = tab.dataset.v; render(); return; }
  const go = t.closest('[data-goto]'); if (go){ e.preventDefault(); state.view=go.dataset.goto; render(); return; }
  const di = t.closest('[data-date]'); if (di){ state.date = di.dataset.date; render(); return; }
  const ci = t.closest('[data-cat-item]'); if (ci){ state.cat = ci.dataset.catItem; render(); return; }
  const chip = t.closest('.chip[data-cat]'); if (chip){ state.view='topic'; state.cat=chip.dataset.cat; render(); window.scrollTo(0,0); return; }
  const th = t.closest('.thumbs img'); if (th){ $('#viewerImg').src = th.src; viewer.showModal(); return; }
  const rm = t.closest('#previews button'); if (rm){ pending.splice(+rm.dataset.i,1); renderPreviews(); return; }
  const dr = t.closest('[data-del-ref]'); if (dr){ if (confirm('刪除這本教科書？')){ await db.del('refs', dr.dataset.delRef); await load(); render(); } return; }
  const btn = t.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('article[data-id]'); const n = card && notes.find(x=>x.id===card.dataset.id);
  switch (btn.dataset.act){
    case 'edit': openEdit(n); break;
    case 'delete':
      if (confirm(`刪除「${n.title}」？`)){ await db.del('notes', n.id);
        for (const id of n.imageIds||[]) if (!notes.some(o=>o.id!==n.id && (o.imageIds||[]).includes(id))) await db.del('images', id);
        await load(); render(); } break;
    case 'related': findRelated(n, btn); break;
    case 'merge': mergeCategory(btn); break;
    case 'recat': recategorize(btn); break;
    case 'export-day': download(`筆記_${state.date}.md`, await buildMD(x=>x.date===state.date, `${state.date} 筆記`)); break;
    case 'export-cat': download(`筆記_${state.cat}.md`, await buildMD(x=>x.category===state.cat, `${state.cat} 筆記`)); break;
    case 'export-all-md': download(`我的筆記_${today()}.md`, await buildMD(()=>true, '我的課堂筆記')); break;
    case 'copy-all-md': await navigator.clipboard.writeText(await buildMD(()=>true,'我的課堂筆記')); toast('已複製，可直接貼到 Gemini Notebook 的「複製的文字」來源'); break;
    case 'add-ref': $('#refFile').click(); break;
    case 'save-settings': readSettingsForm(); saveSettings(); toast('已儲存設定'); break;
    case 'list-models': readSettingsForm(); $('#sProg').textContent='讀取中…';
      try{ const ms = await listModels(); $('#modelList').innerHTML = ms.map(m=>`<option value="${esc(m)}">`).join('');
        $('#sProg').textContent = `找到 ${ms.length} 個模型，點模型欄位即可選擇。`; } catch(err){ $('#sProg').textContent='⚠️ '+err.message; } break;
    case 'test-ai': readSettingsForm(); saveSettings(); $('#sProg').textContent='測試中…';
      try{ const r = await callAI({prompt:'請只回答「連線成功」四個字。'}); $('#sProg').textContent='✅ '+r.trim().slice(0,40); } catch(err){ $('#sProg').textContent='⚠️ '+err.message; } break;
    case 'backup': {
      const images = await db.all('images'), kv = await db.all('kv');
      download(`筆記備份_${today()}.json`, JSON.stringify({app:'daily-notes', v:1, notes, images, refs:refs.map(r=>({...r, chunks:r.chunks.map(({page,text})=>({page,text}))})), kv}), 'application/json'); break; }
    case 'restore': $('#restoreFile').click(); break;
    case 'wipe': if (confirm('確定清除所有筆記、照片與教科書？此動作無法復原。')){ for (const s of ['notes','images','refs','kv']) await db.clear(s); imgCache.clear(); await load(); render(); toast('已清除'); } break;
  }
});
function readSettingsForm(){
  settings.provider = $('#sProvider').value;
  settings.geminiKey = $('#sGKey').value.trim(); settings.geminiModel = $('#sGModel').value.trim() || DEFAULTS.geminiModel; settings.geminiFallback = $('#sGFallback').value.trim();
  settings.claudeKey = $('#sCKey').value.trim(); settings.claudeModel = $('#sCModel').value.trim() || DEFAULTS.claudeModel;
  settings.lang = $('#sLang').value.trim() || DEFAULTS.lang;
}
document.addEventListener('change', async e=>{
  const t = e.target;
  if (t.id==='sProvider'){ $('#sGemini').hidden = t.value!=='gemini'; $('#sClaude').hidden = t.value!=='claude'; }
  if (t.id==='file' || t.id==='cam'){ await addFiles([...t.files]); t.value=''; }
  if (t.id==='refFile'){
    const prog = $('#refProg');
    for (const f of [...t.files]){ prog.textContent = `匯入「${f.name}」中…`;
      try{ await importRef(f, s=>prog.textContent=`「${f.name}」${s}`); } catch(err){ toast('⚠️ '+err.message, 6000); } }
    t.value=''; await load(); render(); toast('✅ 教科書已加入');
  }
  if (t.id==='restoreFile'){
    try{ const d = JSON.parse(await t.files[0].text()); if (d.app!=='daily-notes') throw new Error('不是本網頁的備份檔');
      if (!confirm(`還原 ${d.notes.length} 則筆記？（同 ID 的資料會被覆蓋）`)) return;
      for (const s of ['notes','images','refs','kv']) for (const v of d[s]||[]) await db.put(s, v);
      await load(); render(); toast('✅ 還原完成'); } catch(err){ toast('⚠️ '+err.message, 5000); }
    t.value='';
  }
});
document.addEventListener('input', e=>{
  if (e.target.id==='q'){ state.q = e.target.value.trim(); if (state.view==='refs'||state.view==='settings') state.view='date'; render(); $('#q').focus(); }
  if (e.target.id==='refQ'){
    const q = e.target.value.trim(), hits = q ? searchRefs(q, 5) : [];
    $('#refRes').innerHTML = hits.map(h=>`<div class="ref"><div class="src">📖《${esc(h.r.name)}》第 ${h.c.page} ${h.r.unit}</div>${highlight(h.c.text.slice(0,300), q.split(/\s+/))}…</div>`).join('') || (q?'<p class="notice">找不到相關段落</p>':'');
  }
});

drop.ondragover = e=>{ e.preventDefault(); drop.style.borderColor='var(--accent)'; };
drop.ondragleave = ()=> drop.style.borderColor='';
drop.ondrop = e=>{ e.preventDefault(); drop.style.borderColor=''; addFiles([...e.dataTransfer.files]); };
document.addEventListener('paste', e=>{ if (dlgAdd.open){ const fs=[...e.clipboardData.files]; if (fs.length) addFiles(fs); } });

await load(); render();
</script>
